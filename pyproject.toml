[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "radhouse"
version = "0.0.1"
description = "Durable, permission-aware work for self-hosted agents"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "psycopg[binary]==3.3.5",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["postgres: requires the owned local PostgreSQL fixture"]

[tool.hatch.build.targets.wheel]
packages = ["src/radhouse"]
