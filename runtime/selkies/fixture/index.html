<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Browser intervention fixture</title>
<style>body{font:18px/1.55 system-ui;color:#202438;background:#f8f5ee;margin:32px}main{max-width:1050px;margin:auto}h1{font-size:30px}label{display:block;margin:12px 0}input,textarea,button{font:inherit;padding:8px}input,textarea{border:1px solid #8c8b98;border-radius:5px}textarea{display:block;width:95%;height:100px}button{cursor:pointer}#marker{font:700 26px monospace;padding:12px;background:#d6efd5}nav{display:flex;gap:25px}.menu{position:relative}.choices{display:none;position:absolute;background:#ece2ff;padding:16px;min-width:200px}.menu:hover .choices,.menu:focus-within .choices{display:block}.drag{background:#ddd0f1;padding:15px;width:200px;cursor:grab}#drop{margin-top:8px;padding:30px;border:2px dashed #9476b4}article p{max-width:900px}.row{display:grid;grid-template-columns:1fr 1fr;gap:20px}</style></head><body><main>
<h1>Browser intervention fixture</h1><div id="marker">Feedback 0</div><canvas id="bits" width="256" height="16"></canvas> <button id="feedback">Show feedback</button>
<nav><a href="index.html">Form</a><a id="new-tab" href="index.html?second=1" target="_blank">Open another tab</a><div class="menu" id="menu" tabindex="0">Hover menu<div class="choices"><button id="choice" onclick="mark()">Choose this item</button></div></div></nav>
<div class="row"><section><h2>Edit a form</h2><label>Name <input id="name" autocomplete="off"></label><label>Notes<textarea id="notes">Select a sentence, replace it, and undo the change.</textarea></label><button onclick="mark()">Save correction</button></section>
<section><h2>Fake sign-in</h2><form id="login"><label>Account <input autocomplete="username" id="account"></label><label>Password <input type="password" id="password" autocomplete="off"></label><label>Code <input id="code" autocomplete="one-time-code" inputmode="numeric"></label><button id="sign-in">Sign in</button></form><p id="signed"></p></section></div>
<h2>Drag and select</h2><div class="drag" draggable="true" id="drag">Drag this card</div><div id="drop">Drop here</div>
<article id="article"><h2>A long article</h2></article>
</main><script>
let sequence=0;const marker=crypto.randomUUID();document.title+=' '+marker.slice(0,8);
function report(){const rects={};for(const id of ['name','notes','menu','choice','drag','drop','account','password','code','sign-in','new-tab','bits','feedback']){const r=document.getElementById(id).getBoundingClientRect();rects[id]={x:r.x,y:r.y,width:r.width,height:r.height};}fetch('/telemetry',{method:'POST',body:JSON.stringify({marker,sequence,focused:document.hasFocus(),name:document.getElementById('name').value,notes:document.getElementById('notes').value,rects,offset:{x:window.screenX+(window.outerWidth-window.innerWidth)/2,y:window.screenY+window.outerHeight-window.innerHeight},sensitive:!!(document.getElementById('password').value||document.getElementById('code').value),dropped:document.getElementById('drop').textContent==='Card moved'})});}
function paint(){const ctx=document.getElementById('bits').getContext('2d');for(let i=0;i<16;i++){ctx.fillStyle=sequence&(1<<i)?'#f02020':'#2020f0';ctx.fillRect(i*16,0,16,16);}}
window.mark=()=>{document.getElementById('marker').textContent='Feedback '+(++sequence);paint();report();};paint();
document.addEventListener('input',mark);document.addEventListener('click',mark);
document.getElementById('login').addEventListener('submit',event=>{event.preventDefault();document.getElementById('password').value='';document.getElementById('code').value='';document.getElementById('signed').textContent='Signed in with synthetic credentials';mark();});
document.getElementById('drag').addEventListener('dragstart',event=>event.dataTransfer.setData('text/plain','card'));
document.getElementById('drop').addEventListener('dragover',event=>event.preventDefault());document.getElementById('drop').addEventListener('drop',event=>{event.preventDefault();event.currentTarget.textContent='Card moved';mark();});
for(let i=1;i<=24;i++){const p=document.createElement('p');p.textContent='Paragraph '+i+'. This repeatable page makes text selection, trackpad scrolling and browser readability observable. Take control, make a correction, and return the same page to the agent.';document.getElementById('article').append(p);}
window.addEventListener('focus',report);window.addEventListener('blur',report);window.addEventListener('scroll',report);setTimeout(report,250);
</script></body></html>
