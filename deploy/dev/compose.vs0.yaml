# Equivalent bounded local fixture recipe. Prefer scripts/vs0.py: it validates
# context, capacity, ownership, bootstrap, deadline and exact-resource cleanup.
# Registry index verified 2026-09-11 via docker buildx imagetools inspect.
# Official source: https://hub.docker.com/_/postgres
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    labels:
      org.radhouse.vs0.run-id: ${RADHOUSE_VS0_RUN_ID:?required random 32-hex run id}
    environment:
      POSTGRES_USER: fixture_owner
      POSTGRES_PASSWORD: ${RADHOUSE_VS0_OWNER_PASSWORD:?required disposable random password}
      POSTGRES_DB: radhouse_vs0_${RADHOUSE_VS0_RUN_ID}
    ports:
      - target: 5432
        published: "0"
        host_ip: 127.0.0.1
        protocol: tcp
    cpus: 1.0
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    privileged: false
    restart: "no"
    volumes:
      - fixture-data:/var/lib/postgresql
volumes:
  fixture-data:
    name: radhouse-vs0-${RADHOUSE_VS0_RUN_ID}
    labels:
      org.radhouse.vs0.run-id: ${RADHOUSE_VS0_RUN_ID}
