services:
  postgres:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    container_name: radhouse-postgres
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: radhouse
      POSTGRES_USER: radhouse_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-owner-password
    secrets:
      - postgres-owner-password
    volumes:
      - /srv/radhouse/postgres/data:/var/lib/postgresql
      - /srv/radhouse/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - 127.0.0.1:55432:5432
    networks:
      database:
        ipv4_address: 172.30.220.2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radhouse_owner -d radhouse"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  database:
    name: radhouse_database
    driver_opts:
      com.docker.network.bridge.name: br-rh-db
    ipam:
      config:
        - subnet: 172.30.220.0/28

secrets:
  postgres-owner-password:
    file: /etc/radhouse/secrets/postgres-owner-password
