# Run through scripts/sonarqube.py on the local development machine after merge.
sonar.projectKey=Running-Digitally_radhouse
sonar.projectName=Radhouse
sonar.links.scm=https://github.com/Running-Digitally/radhouse
sonar.sourceEncoding=UTF-8
sonar.python.version=3.14
sonar.sources=src,scripts,web,site,deploy
sonar.tests=tests,web/test,site/test
sonar.test.inclusions=tests/**,web/test/**,site/test/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/__pycache__/**,**/.venv/**,**/coverage/**,**/test-results/**,**/playwright-report/**,web/test/**,site/test/**,site/public/vendor/**
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
