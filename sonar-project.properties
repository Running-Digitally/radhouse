# Run through scripts/sonarqube.py on the local development machine after merge.
sonar.projectKey=Running-Digitally_radhouse
sonar.projectName=Radhouse
sonar.links.scm=https://github.com/Running-Digitally/radhouse
sonar.sourceEncoding=UTF-8
sonar.python.version=3.14
# runtime contains Radhouse-owned adapters, controls and build/qualification code.
# Only the immutable upstream snapshots are omitted; owned fixtures remain tests.
sonar.sources=src,scripts,web,site,deploy,runtime
sonar.tests=tests,web/test,site/test,runtime/selkies/fixture
sonar.test.inclusions=tests/**,web/test/**,site/test/**,runtime/selkies/fixture/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/__pycache__/**,**/.venv/**,**/coverage/**,**/test-results/**,**/playwright-report/**,web/test/**,site/test/**,site/public/vendor/**,runtime/hermes/fixtures/**
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
